<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Arial, sans-serif" font-size="14">
  <rect width="900" height="460" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
  <text x="20" y="30" font-size="16" font-weight="bold">A. Indexing (once, when the handbook is added)</text>
  <g fill="#e8f0fe" stroke="#3367d6">
    <rect x="20" y="50" width="160" height="56" rx="8"/><rect x="230" y="50" width="160" height="56" rx="8"/>
    <rect x="440" y="50" width="160" height="56" rx="8"/><rect x="650" y="50" width="200" height="56" rx="8" fill="#fef7e0" stroke="#e37400"/>
  </g>
  <g text-anchor="middle">
    <text x="100" y="75">School Handbook PDF</text><text x="100" y="94" font-size="12">+ Document Loader</text>
    <text x="310" y="75">Text Splitter</text><text x="310" y="94" font-size="12">(chunks)</text>
    <text x="520" y="75">Embeddings Model</text><text x="520" y="94" font-size="12">(chunk to vector)</text>
    <text x="750" y="75">Vector Store</text><text x="750" y="94" font-size="12">(e.g. Chroma / FAISS)</text>
  </g>
  <g stroke="#333" marker-end="url(#a)"><line x1="180" y1="78" x2="228" y2="78"/><line x1="390" y1="78" x2="438" y2="78"/><line x1="600" y1="78" x2="648" y2="78"/></g>
  <text x="20" y="170" font-size="16" font-weight="bold">B. Answering (every question)</text>
  <g fill="#e6f4ea" stroke="#188038">
    <rect x="20" y="200" width="160" height="56" rx="8"/><rect x="440" y="200" width="160" height="56" rx="8"/>
    <rect x="650" y="200" width="200" height="56" rx="8"/><rect x="440" y="340" width="160" height="56" rx="8"/>
    <rect x="230" y="340" width="160" height="56" rx="8" fill="#fce8e6" stroke="#c5221f"/>
  </g>
  <g text-anchor="middle">
    <text x="100" y="225">Student / Parent</text><text x="100" y="244" font-size="12">asks a question</text>
    <text x="520" y="225">Embeddings Model</text><text x="520" y="244" font-size="12">(question to vector)</text>
    <text x="750" y="225">Retriever</text><text x="750" y="244" font-size="12">top-k similar chunks</text>
    <text x="520" y="365">Chat Model (LLM)</text><text x="520" y="384" font-size="12">answers from context</text>
    <text x="310" y="365">Conversation Memory</text><text x="310" y="384" font-size="12">previous Q&amp;A</text>
  </g>
  <g stroke="#333" marker-end="url(#a)" fill="none">
    <line x1="180" y1="228" x2="438" y2="228"/><line x1="600" y1="228" x2="648" y2="228"/>
    <line x1="750" y1="106" x2="750" y2="198" stroke-dasharray="5,4"/>
    <path d="M750,256 L750,368 L602,368"/>
    <line x1="390" y1="360" x2="438" y2="360"/>
    <line x1="438" y1="380" x2="392" y2="380"/>
    <path d="M440,390 L100,420 L100,258"/>
  </g>
  <g font-size="12" fill="#555">
    <text x="760" y="160">search</text><text x="610" y="356">relevant chunks</text>
    <text x="250" y="320">history in / new turn saved</text><text x="200" y="435">final answer to user</text>
  </g>
</svg>
